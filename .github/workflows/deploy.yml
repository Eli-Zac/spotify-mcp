name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets can live in this GitHub environment or as plain repository secrets.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Check Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN secret (see README → Deploy from GitHub)."
            exit 1
          fi

      - name: Sync secrets to the Worker
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          DEFAULT_DEVICE: ${{ vars.DEFAULT_DEVICE || secrets.DEFAULT_DEVICE }}
          BLENDS: ${{ vars.BLENDS || secrets.BLENDS }}
        run: |
          secrets_json="$(node scripts/sync-secrets.mjs)"
          if [ "$secrets_json" != "{}" ]; then
            printf '%s' "$secrets_json" | npx wrangler secret bulk
          fi

      - name: Deploy
        run: npx wrangler deploy
